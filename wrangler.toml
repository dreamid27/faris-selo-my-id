# Cloudflare configuration.
# The site is fully static: `bun run build` prerenders into dist/client.
#
# Deploy option A — Cloudflare Pages (dashboard):
#   Build command:      bun run build
#   Build output dir:   dist/client
#
# Deploy option B — Wrangler (Workers static assets):
#   npx wrangler deploy
name = "faris-selo-my-id"
compatibility_date = "2026-08-15"

[assets]
directory = "./dist/client"
not_found_handling = "404-page"
